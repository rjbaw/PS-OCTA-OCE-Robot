name: CI

on:
  push:
  pull_request:

jobs:
  build-test-docker:
    name: Build & Test (Docker)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Show disk usage before cleanup
        run: df -h
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Show disk usage after cleanup
        run: df -h
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build base image locally for tests
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/docker/Dockerfile
          target: base
          tags: octa_ros:ci-base
          platforms: linux/amd64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests in local image
        run: DOCKER_TAG=octa_ros:ci-base make docker-ci-test

  publish:
    needs: [build-test-docker]
    if: github.ref == 'refs/heads/main'
    name: Publish deploy image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Show disk usage before cleanup
        run: df -h
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Show disk usage after cleanup
        run: df -h
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push deploy image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/docker/Dockerfile
          target: run
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/octa_ros:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

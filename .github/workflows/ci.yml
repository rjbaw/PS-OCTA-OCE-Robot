name: CI

on:
  push:
  pull_request:

jobs:
  build-test-docker:
    name: Build & Test (Docker)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/octa_ros-ci:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & Test inside container (mounted repo)
        run: |
          docker run --rm --name octa_ci \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COLCON_HOME=/tmp/.colcon \
            -e COLCON_LOG_PATH=/tmp/colcon_logs \
            -w /workspace/repo \
            -v "${{ github.workspace }}:/workspace/repo" \
            ghcr.io/${{ github.repository_owner }}/octa_ros-ci:pr \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/colcon_logs /tmp/.colcon /tmp/colcon_build /tmp/colcon_install /tmp/colcon_log
              set +u
              source /opt/ros/jazzy/setup.bash
              set -u
              colcon --log-base /tmp/colcon_log build \
                --symlink-install \
                --build-base /tmp/colcon_build \
                --install-base /tmp/colcon_install \
                --packages-select octa_ros \
                --base-paths /workspace/repo \
                --cmake-args -DCMAKE_BUILD_TYPE=Debug -DENABLE_CLANG_TIDY=ON
              colcon --log-base /tmp/colcon_log test \
                --packages-select octa_ros \
                --base-paths /workspace/repo \
                --build-base /tmp/colcon_build \
                --install-base /tmp/colcon_install
              colcon test-result --verbose --test-result-base /tmp/colcon_build
            '
      - name: Publish image on main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/octa_ros:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

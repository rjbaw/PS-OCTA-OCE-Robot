name: CI

on:
  push:
  pull_request:

jobs:
  test-with-prebuilt-image:
    name: Test with prebuilt image
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    env:
      DOCKER_TAG: ghcr.io/${{ github.repository_owner }}/octa_ros:latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt image
        run: docker pull "$DOCKER_TAG"
      - name: Run tests in pulled image
        run: DOCKER_TAG="$DOCKER_TAG" make docker-ci-test

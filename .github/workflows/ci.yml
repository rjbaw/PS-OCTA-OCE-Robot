name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build with GHA cache, test, and push
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Show disk usage before cleanup
        run: df -h
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Show disk usage after cleanup
        run: df -h
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          platforms: linux/amd64
          cache-from: type=gha,scope=octa_ros
          sbom: false
          provenance: false
      - name: Build and push run image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: run
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octa_ros:latest
            ghcr.io/${{ github.repository_owner }}/octa_ros:sha-${{ github.sha }}
          cache-from: type=gha,scope=octa_ros
          sbom: false
          provenance: false

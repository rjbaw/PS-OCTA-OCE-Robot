repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: make-lint
        name: make lint (format + clang-tidy)
        entry: bash -lc 'make lint FILE="$@"'
        language: system
        types_or: [c, c++]
        require_serial: true
        pass_filenames: true
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(c|cc|cxx|cpp|h|hh|hpp|hxx)$
      - id: cmake-format
        name: cmake-format
        entry: cmake-format -i
        language: system
        files: (^CMakeLists\.txt$|\.cmake$)

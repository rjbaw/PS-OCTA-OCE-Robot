repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(c|cc|cxx|cpp|h|hh|hpp|hxx)$
      - id: clang-tidy
        name: clang-tidy (project sources only)
        entry: bash -lc 'tools/clang-tidy-wrapper.sh --project-root $(git rev-parse --show-toplevel) --allow-subdir src --allow-subdir include'
        language: system
        types_or: [c, c++]
        require_serial: true
        pass_filenames: true
      - id: cmake-format
        name: cmake-format
        entry: cmake-format -i
        language: system
        files: (^CMakeLists\.txt$|\.cmake$)
